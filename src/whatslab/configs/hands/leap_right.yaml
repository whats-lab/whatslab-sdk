# LEAP Hand right — 글러브(OpenXR 26관절) → DexPilot (dex-retargeting 0.4.6).
# 키 설명은 docs/API.md "손 리타게팅 config (configs/hands)".
# 손목·손끝 링크는 dex-retargeting configs/teleop/leap_hand_right_dexpilot.yml 그대로.
name: leap_right
side: right
urdf: leap_hand/leap_hand_right.urdf
palm_links: {index: pip, middle: pip_2, pinky: pip_3}
human_hand_length: 0.19
# 손가락이 4개(소지 없음) — palm_links.pinky 자리에 약지를 둔다.
# SLSQP 평가 상한(틱당). 프레임 무관 지표는 무제한과 같고 2손 p99 지연을 8ms 안으로 둔다.
max_evals: 20
retargeting:
  type: DexPilot
  wrist_link_name: base
  finger_tip_link_names: [thumb_tip_head, index_tip_head, middle_tip_head, ring_tip_head]
  low_pass_alpha: 0.5
