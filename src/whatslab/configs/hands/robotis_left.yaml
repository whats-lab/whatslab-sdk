# ROBOTIS HX5-D20 left — 글러브(OpenXR 26관절) → DexPilot (dex-retargeting 0.4.6).
# 키 설명은 docs/API.md "손 리타게팅 config (configs/hands)".
name: robotis_left
side: left
urdf: robotis_hx5_d20/urdf/hx5_d20_left.urdf
palm_links: {index: finger_l_link6, middle: finger_l_link10, pinky: finger_l_link18}
human_hand_length: 0.19
# SLSQP 평가 상한(틱당). 프레임 무관 지표는 무제한과 같고 2손 p99 지연을 8ms 안으로 둔다.
max_evals: 20
retargeting:
  type: DexPilot
  wrist_link_name: hx5_d20_left_base
  finger_tip_link_names: [left_sensor_thumb_distal, left_sensor_index_distal, left_sensor_middle_distal, left_sensor_ring_distal, left_sensor_pinky_distal]
  low_pass_alpha: 0.5
