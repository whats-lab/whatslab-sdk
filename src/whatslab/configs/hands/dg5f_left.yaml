# Tesollo DG-5F left — 글러브(OpenXR 26관절) → DexPilot (dex-retargeting 0.4.6).
# 키 설명은 docs/API.md "손 리타게팅 config (configs/hands)".
name: dg5f_left
side: left
urdf: tesollo_dg5f/dg5f_left.urdf
palm_links: {index: ll_dg_2_2, middle: ll_dg_3_2, pinky: ll_dg_5_3}
human_hand_length: 0.19
# 손가락 PIP·DIP 는 URDF 가 ±90° 라 DexPilot 이 역방향으로 꺾는 해를 쓴다 — 사람 범위로 자른다.
joint_limits_deg:
  "lj_dg_[2-5]_[34]": [-5.0, 90.0]
# SLSQP 평가 상한(틱당). 프레임 무관 지표는 무제한과 같고 2손 p99 지연을 8ms 안으로 둔다.
max_evals: 20
retargeting:
  type: DexPilot
  wrist_link_name: ll_dg_palm
  finger_tip_link_names: [ll_dg_1_tip, ll_dg_2_tip, ll_dg_3_tip, ll_dg_4_tip, ll_dg_5_tip]
  low_pass_alpha: 0.5
