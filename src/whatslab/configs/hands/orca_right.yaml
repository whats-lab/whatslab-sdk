# ORCA right — 글러브(OpenXR 26관절) → DexPilot (dex-retargeting 0.4.6).
# 키 설명은 docs/API.md "손 리타게팅 config (configs/hands)".
name: orca_right
side: right
urdf: orca_hand/urdf/right.urdf
# 손바닥 프레임(q=0 FK): 손목 링크 → 중지 MCP = 손가락 방향, 소지 MCP → 검지 MCP = 요측.
palm_links: {index: I-PP_bacbd481, middle: M-PP_08efa608, pinky: P-PP_1d411b9b}
# 손목 관절은 팔 IK(rig target_ee = Carpals)가 쓴다 — 리타게팅에서 빼고 0 으로 고정한다.
fixed_joints:
  R-Carpals_8d1f1041_to_TopTower-Model_4a80d30e: 0.0
human_hand_length: 0.19          # 사람 손목 → 중지 끝 (m). scaling_factor 를 안 주면 로봇/사람 길이비
# SLSQP 평가 상한(틱당). 프레임 무관 지표는 무제한과 같고 2손 p99 지연을 8ms 안으로 둔다.
max_evals: 20
retargeting:
  type: DexPilot
  wrist_link_name: R-Carpals_8d1f1041
  finger_tip_link_names: [right_sensor_thumb_distal, right_sensor_index_distal, right_sensor_middle_distal, right_sensor_ring_distal, right_sensor_pinky_distal]
  low_pass_alpha: 0.5
