name: wuji_hand2_right
side: right
urdf: wuji_hand2/wuji_hand2_right.urdf
palm_links: {index: r_index_finger_proximal, middle: r_middle_finger_proximal, pinky: r_pinky_proximal}
human_hand_length: 0.19
max_evals: 10
retargeting:
  type: DexPilot
  wrist_link_name: r_wrist
  finger_tip_link_names: [r_thumb_tip, r_index_finger_tip, r_middle_finger_tip, r_ring_finger_tip, r_pinky_tip]
  low_pass_alpha: 0.5
posture_prior:
  weight: 0.01
  joints:
    r_thumb_mcp: {thumb.mcp: 1.0}
    r_thumb_ip: {thumb.ip: 1.0}
    r_index_finger_mcp_abd: {index.spread: 1.0}
    r_index_finger_mcp_flex: {index.mcp: 1.0}
    r_index_finger_pip: {index.pip: 1.0}
    r_index_finger_dip: {index.dip: 1.0}
    r_middle_finger_mcp_abd: {middle.spread: 1.0}
    r_middle_finger_mcp_flex: {middle.mcp: 1.0}
    r_middle_finger_pip: {middle.pip: 1.0}
    r_middle_finger_dip: {middle.dip: 1.0}
    r_ring_finger_mcp_abd: {ring.spread: 1.0}
    r_ring_finger_mcp_flex: {ring.mcp: 1.0}
    r_ring_finger_pip: {ring.pip: 1.0}
    r_ring_finger_dip: {ring.dip: 1.0}
    r_pinky_mcp_abd: {little.spread: 1.0}
    r_pinky_mcp_flex: {little.mcp: 1.0}
    r_pinky_pip: {little.pip: 1.0}
    r_pinky_dip: {little.dip: 1.0}
  thumb_base:
    joints: [r_thumb_cmc_flex, r_thumb_cmc_abd]
    bone: [r_thumb_proximal_abd, r_thumb_middle]
    flex_joint: r_thumb_mcp
    step_deg: 2.0
    axis_weight: 0.5
  abduction: {full_deg: 60.0, decay: 1.0, gain: 10.0}
  joint_weights: {r_pinky_mcp_flex: 0.03}
