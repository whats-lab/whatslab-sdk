name: linkerhand_o30_right
side: right
urdf: linkerhand_o30/linkerhand_o30_right.urdf
palm_links: {index: index_metacarpals, middle: middle_metacarpals, pinky: pinky_metacarpals}
link_offsets:
  thumb_distal: [-0.0001, 0.0216, -0.0069]
  index_distal: [-0.0066, 0.0001, 0.0217]
  middle_distal: [-0.0066, 0.0001, 0.0217]
  ring_distal: [-0.0066, 0.0001, 0.0217]
  pinky_distal: [-0.0066, 0.0001, 0.0217]
human_hand_length: 0.19
max_evals: 10
retargeting:
  type: DexPilot
  wrist_link_name: hand_base_link
  finger_tip_link_names: [thumb_distal, index_distal, middle_distal, ring_distal, pinky_distal]
  low_pass_alpha: 0.5
posture_prior:
  weight: 0.01
  joints:
    thumb_mcp: {thumb.mcp: 1.0}
    thumb_ip: {thumb.ip: 1.0}
    index_mcp_roll: {index.spread: 1.0}
    index_mcp_pitch: {index.mcp: 1.0}
    index_pip: {index.pip: 1.0}
    index_dip: {index.dip: 1.0}
    middle_mcp_roll: {middle.spread: 1.0}
    middle_mcp_pitch: {middle.mcp: 1.0}
    middle_pip: {middle.pip: 1.0}
    middle_dip: {middle.dip: 1.0}
    ring_mcp_roll: {ring.spread: 1.0}
    ring_mcp_pitch: {ring.mcp: 1.0}
    ring_pip: {ring.pip: 1.0}
    ring_dip: {ring.dip: 1.0}
    pinky_mcp_roll: {little.spread: 1.0}
    pinky_mcp_pitch: {little.mcp: 1.0}
    pinky_pip: {little.pip: 1.0}
    pinky_dip: {little.dip: 1.0}
  thumb_base:
    joints: [thumb_cmc_roll, thumb_cmc_yaw]
    bone: [thumb_metacarpals_base2, thumb_proximal]
    flex_joint: thumb_mcp
    step_deg: 2.0
    axis_weight: 0.5
  abduction: {full_deg: 60.0, decay: 1.0, gain: 10.0}
  joint_weights: {thumb_mcp: 0.1, pinky_pip: 0.1}
