name: leap_hand_v2_adv_left
side: left
urdf: leap_hand_v2_adv/leap_hand_v2_adv_left.urdf
palm_links: {index: axle_4_gear_together_mir_2, middle: axle_4_gear_together_mir_3, pinky: axle_4_gear_together_2}
link_offsets:
  no_finger_frame: [0.0, 0.088, -0.125]
human_hand_length: 0.19
max_evals: 10
retargeting:
  type: DexPilot
  wrist_link_name: no_finger_frame
  finger_tip_link_names: [realtip_5, realtip, realtip_2, realtip_3, realtip_4]
  low_pass_alpha: 0.5
posture_prior:
  weight: 0.04
  joints:
    thumb_ip: {thumb.mcp: 1.0, thumb.ip: 1.0}
    index_mcps: {index.spread: -1.0}
    index_mcpf: {index.mcp: 1.0}
    index_dip: {index.pip: 0.333, index.dip: 0.333, middle.pip: 0.333}
    middle_mcps: {middle.spread: -1.0}
    middle_mcpf: {middle.mcp: 1.0}
    middle_dip: {middle.dip: 1.0}
    ring_mcps: {ring.spread: -1.0}
    ring_mcpf: {ring.mcp: 1.0}
    ring_dip: {ring.pip: 0.5, ring.dip: 0.5}
    pinky_mcps: {little.spread: -1.0}
    pinky_mcpf: {little.mcp: 1.0}
    pinky_dip: {little.pip: 0.5, little.dip: 0.5}
  thumb_base:
    joints: [palm_thumb, thumb_mcpf]
    bone: [axle_4_gear_together_mir, thumb_with_motor]
    flex_joint: thumb_mcps
    step_deg: 2.0
    axis_weight: 0.5
  joint_weights: {ring_mcpf: 0.3, index_mcpf: 0.3, pinky_mcpf: 0.1}
