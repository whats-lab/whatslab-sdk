name: inspire_right
side: right
urdf: inspire_hand/inspire_hand_right.urdf
palm_links: {index: index_proximal, middle: middle_proximal, pinky: pinky_proximal}
human_hand_length: 0.19
max_evals: 10
retargeting:
  type: DexPilot
  wrist_link_name: base
  finger_tip_link_names: [thumb_tip, index_tip, middle_tip, ring_tip, pinky_tip]
  low_pass_alpha: 0.5
posture_prior:
  weight: 0.01
  joints:
    index_proximal_joint: {index.mcp: 0.469, index.pip: 0.499, index.dip: 0.25}
    middle_proximal_joint: {middle.mcp: 0.469, middle.pip: 0.499, middle.dip: 0.25}
    ring_proximal_joint: {ring.mcp: 0.469, ring.pip: 0.499, ring.dip: 0.25}
    pinky_proximal_joint: {little.mcp: 0.469, little.pip: 0.499, little.dip: 0.25}
  thumb_base:
    joints: [thumb_proximal_yaw_joint, thumb_proximal_pitch_joint]
    bone: [thumb_proximal, thumb_intermediate]
    flex_joint: thumb_intermediate_joint
    step_deg: 2.0
    axis_weight: 0.5
