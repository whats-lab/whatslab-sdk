name: dexhand_trs_right
side: right
urdf: dexhand_trs/dexhand_trs_right.urdf
palm_links: {index: index_knuckle_1, middle: middle_knuckle_1, pinky: pinky_knuckle_1}
fixed_joints:
  wrist_pitch_lower: 0.0
  wrist_yaw: 0.0
  wrist_pitch_upper: 0.0
human_hand_length: 0.19
max_evals: 10
retargeting:
  type: DexPilot
  wrist_link_name: index_bulk_1
  finger_tip_link_names: [thumb_tip_1, index_tip_1, middle_tip_1, ring_tip_1, pinky_tip_1]
  low_pass_alpha: 0.5
posture_prior:
  weight: 0.01
  joints:
    thumb_pitch: {thumb.mcp: 1.0}
    thumb_knuckle: {thumb.ip: 1.0}
    index_yaw: {index.spread: -1.0}
    index_pitch: {index.mcp: 1.0}
    index_knuckle: {index.pip: 1.0, index.dip: 0.5}
    middle_yaw: {middle.spread: -1.0}
    middle_pitch: {middle.mcp: 1.0}
    middle_knuckle: {middle.pip: 1.0, middle.dip: 0.5}
    ring_yaw: {ring.spread: -1.0}
    ring_pitch: {ring.mcp: 1.0}
    ring_knuckle: {ring.pip: 1.0, ring.dip: 0.5}
    pinky_yaw: {little.spread: -1.0}
    pinky_pitch: {little.mcp: 1.0}
    pinky_knuckle: {little.pip: 1.0, little.dip: 0.5}
  thumb_base:
    joints: [thumb_yaw, thumb_roll]
    bone: [thumb_cmc_a_1, thumb_plp_1]
    flex_joint: thumb_pitch
    step_deg: 2.0
    axis_weight: 0.5
