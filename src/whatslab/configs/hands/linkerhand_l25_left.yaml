name: linkerhand_l25_left
side: left
urdf: linkerhand_l25/linkerhand_l25_left.urdf
palm_links: {index: index_metacarpals, middle: middle_metacarpals, pinky: pinky_metacarpals}
link_offsets:
  thumb_distal: [-0.0087, 0.0, 0.0291]
  index_distal: [-0.0164, 0.0, 0.0212]
  middle_distal: [-0.0164, 0.0, 0.0212]
  ring_distal: [-0.0164, 0.0, 0.0212]
  pinky_distal: [-0.0164, 0.0, 0.0212]
human_hand_length: 0.19
max_evals: 10
retargeting:
  type: DexPilot
  wrist_link_name: hand_base_link
  finger_tip_link_names: [thumb_distal, index_distal, middle_distal, ring_distal, pinky_distal]
  low_pass_alpha: 0.5
posture_prior:
  weight: 0.015
  joints:
    thumb_cmc_pitch: {thumb.mcp: 1.0}
    thumb_mcp: {thumb.ip: 0.495}
    index_mcp_roll: {index.spread: -1.0}
    index_mcp_pitch: {index.mcp: 1.0}
    index_pip: {index.pip: 0.558, index.dip: 0.497}
    middle_mcp_roll: {middle.spread: -1.0}
    middle_mcp_pitch: {middle.mcp: 1.0}
    middle_pip: {middle.pip: 0.558, middle.dip: 0.497}
    ring_mcp_roll: {ring.spread: -1.0}
    ring_mcp_pitch: {ring.mcp: 1.0}
    ring_pip: {ring.pip: 0.558, ring.dip: 0.497}
    pinky_mcp_roll: {little.spread: -1.0}
    pinky_mcp_pitch: {little.mcp: 1.0}
    pinky_pip: {little.pip: 0.558, little.dip: 0.497}
  thumb_base:
    joints: [thumb_cmc_roll, thumb_cmc_yaw]
    bone: [thumb_metacarpals_base2, thumb_metacarpals]
    flex_joint: thumb_cmc_pitch
    step_deg: 2.0
    axis_weight: 0.5
  abduction: {full_deg: 60.0, decay: 1.0, gain: 10.0}
  joint_weights: {thumb_cmc_pitch: 0.1, thumb_mcp: 0.1, pinky_pip: 0.1, pinky_mcp_pitch: 0.1}
