name: wuji_right
urdf: wuji_hand/wuji_hand_right.urdf
wrist: {link: right_palm_link, offset: [0.0, 0.0075, 0.0]}
palm: {index: right_finger2_link1, middle: right_finger3_link1, ring: right_finger4_link1}
fingers:
- name: thumb
  link: right_finger1_tip_link
  joints: [right_finger1_joint1, right_finger1_joint2, right_finger1_joint3, right_finger1_joint4]
- name: index
  link: right_finger2_tip_link
  joints: [right_finger2_joint1, right_finger2_joint2, right_finger2_joint3, right_finger2_joint4]
- name: middle
  link: right_finger3_tip_link
  joints: [right_finger3_joint1, right_finger3_joint2, right_finger3_joint3, right_finger3_joint4]
- name: ring
  link: right_finger4_tip_link
  joints: [right_finger4_joint1, right_finger4_joint2, right_finger4_joint3, right_finger4_joint4]
- name: little
  link: right_finger5_tip_link
  joints: [right_finger5_joint1, right_finger5_joint2, right_finger5_joint3, right_finger5_joint4]
limits_deg:
  right_finger1_joint3: [0.0, 89.5]
  right_finger1_joint4: [0.0, 89.2]
  right_finger2_joint1: [0.0, 89.0]
  right_finger2_joint2: [-20.0, 20.0]
  right_finger2_joint3: [0.0, 88.0]
  right_finger2_joint4: [0.0, 89.0]
  right_finger3_joint1: [0.0, 89.0]
  right_finger3_joint2: [-20.0, 20.0]
  right_finger3_joint3: [0.0, 88.0]
  right_finger3_joint4: [0.0, 89.0]
  right_finger4_joint1: [0.0, 89.0]
  right_finger4_joint2: [-20.0, 20.0]
  right_finger4_joint3: [0.0, 88.0]
  right_finger4_joint4: [0.0, 89.0]
  right_finger5_joint1: [0.0, 89.0]
  right_finger5_joint2: [-20.0, 20.0]
  right_finger5_joint3: [0.0, 88.0]
  right_finger5_joint4: [0.0, 89.0]
posture:
  right_finger1_joint3: {thumb.mcp: 1.0}
  right_finger1_joint4: {thumb.ip: 1.0}
  right_finger2_joint1: {index.mcp: 1.0}
  right_finger2_joint3: {index.pip: 1.0}
  right_finger2_joint4: {index.dip: 1.0}
  right_finger3_joint1: {middle.mcp: 1.0}
  right_finger3_joint3: {middle.pip: 1.0}
  right_finger3_joint4: {middle.dip: 1.0}
  right_finger4_joint1: {ring.mcp: 1.0}
  right_finger4_joint3: {ring.pip: 1.0}
  right_finger4_joint4: {ring.dip: 1.0}
  right_finger5_joint1: {little.mcp: 1.0}
  right_finger5_joint3: {little.pip: 1.0}
  right_finger5_joint4: {little.dip: 1.0}
collision:
  margin_mm: 4.0
  pairs:
  - - [right_finger1_link3, right_finger1_link4, right_finger1_tip_link]
    - [right_palm_link]
  - - [right_finger1_link3, right_finger1_link4]
    - [right_finger2_link2, right_finger2_link3, right_finger2_link4, right_finger3_link2, right_finger3_link3]
  - - [right_finger1_tip_link]
    - [right_finger2_link2, right_finger2_link3, right_finger3_link2]
