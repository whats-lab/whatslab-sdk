name: igris_c_right
urdf: igris_c_hand/igris_c_hand_right_coupled.urdf
wrist: {link: r_palm}
palm: {index: r_index_middle, middle: r_middle_middle, ring: r_ring_middle}
fingers:
- name: thumb
  link: r_thumb_tip
  joints: [r_0_joint_thumb_proximal, r_1_joint_thumb_middle]
- name: index
  link: r_index_tip
  joints: [r_3_joint_index_middle]
- name: middle
  link: r_middle_tip
  joints: [r_5_joint_middle_middle]
- name: ring
  link: r_ring_tip
  joints: [r_7_joint_ring_middle]
- name: little
  link: r_little_tip
  joints: [r_9_joint_little_middle]
limits_deg:
  r_1_joint_thumb_middle: [0.0, 70.0]
  r_3_joint_index_middle: [0.0, 90.0]
  r_5_joint_middle_middle: [0.0, 90.0]
  r_7_joint_ring_middle: [0.0, 90.0]
  r_9_joint_little_middle: [0.0, 90.0]
posture:
  r_1_joint_thumb_middle: {thumb.mcp: 0.5, thumb.ip: 0.5}
  r_3_joint_index_middle: {index.mcp: 0.5, index.pip: 0.5}
  r_5_joint_middle_middle: {middle.mcp: 0.5, middle.pip: 0.5}
  r_7_joint_ring_middle: {ring.mcp: 0.5, ring.pip: 0.5}
  r_9_joint_little_middle: {little.mcp: 0.5, little.pip: 0.5}
collision:
  margin_mm: 4.0
  pairs:
  - - [r_thumb_distal, r_thumb_middle]
    - [r_palm]
  - - [r_thumb_distal]
    - [r_index_middle, r_index_distal, r_middle_middle, r_middle_distal]
