name: dclaw_right
urdf: dclaw_gripper/dclaw_gripper.urdf
wrist: {link: base_link, offset: [0.0, 0.0, 0.01]}
palm:
  index: link_f2_2
  ring: link_f1_2
  shift: [0.0, -0.0304, 0.01]
fingers:
- name: thumb
  link: link_f3_3
  offset: [0.075, 0.0, 0.0]
  joints: [joint_f3_0, joint_f3_1, joint_f3_2]
- name: index
  link: link_f2_3
  offset: [0.075, 0.0, 0.0]
  joints: [joint_f2_0, joint_f2_1, joint_f2_2]
- name: middle
  link: link_f1_3
  offset: [0.075, 0.0, 0.0]
  joints: [joint_f1_0, joint_f1_1, joint_f1_2]
limits_deg:
  joint_f1_0: [-20.0, 20.0]
  joint_f1_1: [-90.0, 0.0]
  joint_f1_2: [0.0, 90.0]
  joint_f2_0: [-20.0, 20.0]
  joint_f2_1: [0.0, 90.0]
  joint_f2_2: [-90.0, 0.0]
  joint_f3_1: [0.0, 90.0]
  joint_f3_2: [0.0, 90.0]
posture:
  joint_f3_1: {thumb.mcp: 1.0}
  joint_f3_2: {thumb.ip: 1.0}
  joint_f2_1: {index.mcp: 1.0}
  joint_f2_2: {index.pip: -0.5, index.dip: -0.5}
  joint_f1_1: {middle.mcp: -1.0}
  joint_f1_2: {middle.pip: 0.5, middle.dip: 0.5}
collision:
  margin_mm: 4.0
  pairs:
  - - [link_f3_3, link_f3_2]
    - [base_link]
  - - [link_f3_3]
    - [link_f2_2, link_f2_3, link_f1_2, link_f1_3]
