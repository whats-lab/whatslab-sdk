name: xhand1_star1_right
urdf: robotera_xhand1_star1/robotera_xhand1_star1_right.urdf
wrist: {link: right_hand_link}
palm: {index: right_hand_index_rota_link1, middle: right_hand_mid_link1, ring: right_hand_ring_link1}
fingers:
- name: thumb
  link: right_hand_thumb_rota_tip
  joints: [right_hand_thumb_bend_joint, right_hand_thumb_rota_joint1, right_hand_thumb_rota_joint2]
- name: index
  link: right_hand_index_rota_tip
  joints: [right_hand_index_bend_joint, right_hand_index_joint1, right_hand_index_joint2]
- name: middle
  link: right_hand_mid_tip
  joints: [right_hand_mid_joint1, right_hand_mid_joint2]
- name: ring
  link: right_hand_ring_tip
  joints: [right_hand_ring_joint1, right_hand_ring_joint2]
- name: little
  link: right_hand_pinky_tip
  joints: [right_hand_pinky_joint1, right_hand_pinky_joint2]
limits_deg:
  right_hand_thumb_rota_joint1: [0.0, 90.0]
  right_hand_thumb_rota_joint2: [0.0, 90.0]
  right_hand_index_joint1: [0.0, 95.0]
  right_hand_index_joint2: [0.0, 90.0]
  right_hand_mid_joint1: [0.0, 95.0]
  right_hand_mid_joint2: [0.0, 90.0]
  right_hand_ring_joint1: [0.0, 95.0]
  right_hand_ring_joint2: [0.0, 90.0]
  right_hand_pinky_joint1: [0.0, 95.0]
  right_hand_pinky_joint2: [0.0, 90.0]
posture:
  right_hand_thumb_rota_joint1: {thumb.mcp: 1.0}
  right_hand_thumb_rota_joint2: {thumb.ip: 1.0}
  right_hand_index_joint1: {index.mcp: 1.0}
  right_hand_index_joint2: {index.pip: 1.0, index.dip: 0.5}
  right_hand_mid_joint1: {middle.mcp: 1.0}
  right_hand_mid_joint2: {middle.pip: 1.0, middle.dip: 0.5}
  right_hand_ring_joint1: {ring.mcp: 1.0}
  right_hand_ring_joint2: {ring.pip: 1.0, ring.dip: 0.5}
  right_hand_pinky_joint1: {little.mcp: 1.0}
  right_hand_pinky_joint2: {little.pip: 1.0, little.dip: 0.5}
collision:
  margin_mm: 4.0
  pairs:
  - - [right_hand_thumb_rota_link1, right_hand_thumb_rota_link2]
    - [right_hand_link]
  - - [right_hand_thumb_rota_link1]
    - [right_hand_index_rota_link1, right_hand_index_rota_link2, right_hand_mid_link1]
  - - [right_hand_thumb_rota_link2]
    - [right_hand_index_rota_link1, right_hand_index_rota_link2, right_hand_mid_link1, right_hand_mid_link2]
