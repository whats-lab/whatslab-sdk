name: inspire_dfx_right
urdf: inspire_rh56dfx_unitree/inspire_rh56dfx_unitree_right.urdf
wrist:
  link: R_hand_base_link
  offset: [0.0, 0.0021, -0.022]
palm: {index: R_index_proximal, middle: R_middle_proximal, ring: R_ring_proximal}
fingers:
- name: thumb
  link: R_thumb_tip
  joints: [R_thumb_proximal_yaw_joint, R_thumb_proximal_pitch_joint]
- name: index
  link: R_index_tip
  joints: [R_index_proximal_joint]
- name: middle
  link: R_middle_tip
  joints: [R_middle_proximal_joint]
- name: ring
  link: R_ring_tip
  joints: [R_ring_proximal_joint]
- name: little
  link: R_pinky_tip
  joints: [R_pinky_proximal_joint]
limits_deg:
  R_index_proximal_joint: [0.0, 90.0]
  R_middle_proximal_joint: [0.0, 90.0]
  R_ring_proximal_joint: [0.0, 90.0]
  R_pinky_proximal_joint: [0.0, 90.0]
posture:
  R_thumb_proximal_pitch_joint: {thumb.mcp: 0.5, thumb.ip: 0.5}
  R_index_proximal_joint: {index.mcp: 0.5, index.pip: 0.5}
  R_middle_proximal_joint: {middle.mcp: 0.5, middle.pip: 0.5}
  R_ring_proximal_joint: {ring.mcp: 0.5, ring.pip: 0.5}
  R_pinky_proximal_joint: {little.mcp: 0.5, little.pip: 0.5}
collision:
  margin_mm: 4.0
  pairs:
  - - [R_thumb_intermediate, R_thumb_distal]
    - [R_hand_base_link]
  - - [R_thumb_distal]
    - [R_index_proximal, R_index_intermediate, R_middle_proximal]
abd_scale: 0.0
