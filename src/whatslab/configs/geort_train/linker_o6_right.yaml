name: linker_o6_right
urdf: linkerhand_o6/linkerhand_o6_right.urdf
wrist: {link: rh_hand_base_link}
palm: {index: rh_index_proximal, middle: rh_middle_proximal, ring: rh_ring_proximal}
fingers:
- name: thumb
  link: rh_thumb_distal
  offset: [0.0, 0.0071, 0.046]
  joints: [rh_thumb_cmc_yaw, rh_thumb_cmc_pitch]
- name: index
  link: rh_index_distal
  offset: [0.014, 0.0001, 0.0359]
  joints: [rh_index_mcp_pitch]
- name: middle
  link: rh_middle_distal
  offset: [0.014, 0.0001, 0.0359]
  joints: [rh_middle_mcp_pitch]
- name: ring
  link: rh_ring_distal
  offset: [0.014, 0.0001, 0.0359]
  joints: [rh_ring_mcp_pitch]
- name: little
  link: rh_pinky_distal
  offset: [0.014, 0.0001, 0.0359]
  joints: [rh_pinky_mcp_pitch]
limits_deg:
  rh_index_mcp_pitch: [0.0, 90.0]
  rh_middle_mcp_pitch: [0.0, 90.0]
  rh_ring_mcp_pitch: [0.0, 90.0]
  rh_pinky_mcp_pitch: [0.0, 90.0]
posture:
  rh_thumb_cmc_pitch: {thumb.mcp: 0.5, thumb.ip: 0.5}
  rh_index_mcp_pitch: {index.mcp: 0.5, index.pip: 0.5}
  rh_middle_mcp_pitch: {middle.mcp: 0.5, middle.pip: 0.5}
  rh_ring_mcp_pitch: {ring.mcp: 0.5, ring.pip: 0.5}
  rh_pinky_mcp_pitch: {little.mcp: 0.5, little.pip: 0.5}
collision:
  margin_mm: 4.0
  pairs:
  - - [rh_thumb_distal, rh_thumb_metacarpals]
    - [rh_hand_base_link]
  - - [rh_thumb_distal]
    - [rh_index_proximal, rh_index_distal, rh_middle_proximal, rh_middle_distal]
abd_scale: 0.0
