name: linker_l20lite_right
urdf: linkerhand_l20lite/linkerhand_l20lite_right.urdf
wrist: {link: hand_base_link}
palm: {index: index_proximal, middle: middle_proximal, ring: ring_proximal}
fingers:
- name: thumb
  link: thumb_distal
  offset: [-0.006, 0.0006, 0.0242]
  joints: [thumb_cmc_roll, thumb_cmc_yaw, thumb_cmc_pitch]
- name: index
  link: index_distal
  offset: [-0.0032, -0.0003, 0.0238]
  joints: [index_mcp_roll, index_mcp_pitch]
- name: middle
  link: middle_distal
  offset: [-0.0034, -0.0003, 0.0238]
  joints: [middle_mcp_pitch]
- name: ring
  link: ring_distal
  offset: [-0.0032, -0.0003, 0.0238]
  joints: [ring_mcp_roll, ring_mcp_pitch]
- name: little
  link: pinky_distal
  offset: [-0.0032, -0.0003, 0.0238]
  joints: [pinky_mcp_roll, pinky_mcp_pitch]
limits_deg:
  index_mcp_pitch: [0.0, 90.0]
  middle_mcp_pitch: [0.0, 90.0]
  ring_mcp_pitch: [0.0, 90.0]
  pinky_mcp_pitch: [0.0, 90.0]
posture:
  thumb_cmc_pitch: {thumb.mcp: 0.5, thumb.ip: 0.5}
  index_mcp_pitch: {index.mcp: 0.5, index.pip: 0.5}
  middle_mcp_pitch: {middle.mcp: 0.5, middle.pip: 0.5}
  ring_mcp_pitch: {ring.mcp: 0.5, ring.pip: 0.5}
  pinky_mcp_pitch: {little.mcp: 0.5, little.pip: 0.5}
collision:
  margin_mm: 4.0
  pairs:
  - - [thumb_distal, thumb_proximal]
    - [hand_base_link]
  - - [thumb_distal]
    - [index_proximal, index_middle, index_distal, middle_proximal, middle_middle]
