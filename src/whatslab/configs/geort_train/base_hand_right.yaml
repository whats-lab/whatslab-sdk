name: base_hand_right
urdf: base_hand/urdf/right.urdf
wrist: {link: right_wrist}
palm: {index: right_index_mcp, middle: right_middle_mcp, ring: right_ring_mcp}
fingers:
- name: thumb
  link: right_thumb_tip
  joints: [right_thumb_cmc0, right_thumb_cmc1_x, right_thumb_cmc1_y, right_thumb_mcp, right_thumb_ip]
- name: index
  link: right_index_tip
  joints: [right_index_mcp_y, right_index_mcp_z, right_index_pip, right_index_dip]
- name: middle
  link: right_middle_tip
  joints: [right_middle_mcp_y, right_middle_mcp_z, right_middle_pip, right_middle_dip]
- name: ring
  link: right_ring_tip
  joints: [right_ring_mcp_y, right_ring_mcp_z, right_ring_pip, right_ring_dip]
- name: little
  link: right_pinky_tip
  joints: [right_pinky_mcp_y, right_pinky_mcp_z, right_pinky_pip, right_pinky_dip]
limits_deg:
  right_thumb_mcp: [-90.0, 0.0]
  right_thumb_ip: [-85.0, 0.0]
  right_index_mcp_y: [-20.0, 20.0]
  right_index_mcp_z: [-95.0, 0.0]
  right_index_pip: [-90.0, 0.0]
  right_index_dip: [-90.0, 0.0]
  right_middle_mcp_y: [-20.0, 20.0]
  right_middle_mcp_z: [-95.0, 0.0]
  right_middle_pip: [-90.0, 0.0]
  right_middle_dip: [-90.0, 0.0]
  right_ring_mcp_y: [-20.0, 20.0]
  right_ring_mcp_z: [-95.0, 0.0]
  right_ring_pip: [-90.0, 0.0]
  right_ring_dip: [-90.0, 0.0]
  right_pinky_mcp_y: [-25.0, 25.0]
  right_pinky_mcp_z: [-95.0, 0.0]
  right_pinky_pip: [-90.0, 0.0]
  right_pinky_dip: [-90.0, 0.0]
posture:
  right_thumb_mcp: {thumb.mcp: -1.0}
  right_thumb_ip: {thumb.ip: -1.0}
  right_index_mcp_z: {index.mcp: -1.0}
  right_index_pip: {index.pip: -1.0}
  right_index_dip: {index.dip: -1.0}
  right_middle_mcp_z: {middle.mcp: -1.0}
  right_middle_pip: {middle.pip: -1.0}
  right_middle_dip: {middle.dip: -1.0}
  right_ring_mcp_z: {ring.mcp: -1.0}
  right_ring_pip: {ring.pip: -1.0}
  right_ring_dip: {ring.dip: -1.0}
  right_pinky_mcp_z: {little.mcp: -1.0}
  right_pinky_pip: {little.pip: -1.0}
  right_pinky_dip: {little.dip: -1.0}
collision:
  margin_mm: 4.0
  pairs:
  - - [right_thumb_mcp, right_thumb_ip]
    - [right_wrist]
  - - [right_thumb_mcp]
    - [right_index_mcp, right_index_pip, right_index_dip, right_middle_mcp, right_middle_pip]
  - - [right_thumb_ip]
    - [right_index_mcp, right_index_pip, right_middle_mcp]
