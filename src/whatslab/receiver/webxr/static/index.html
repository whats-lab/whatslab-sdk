<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>whatslab WebXR</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif;
         background: #111; color: #eee; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  button { font-size: 20px; padding: 14px 28px; border-radius: 8px;
           border: 1px solid #555; background: #1e6; color: #041; cursor: pointer; }
  button[disabled] { background: #333; color: #777; cursor: default; }
  #log { margin-top: 20px; font-family: ui-monospace, monospace; font-size: 13px;
         white-space: pre-wrap; color: #9c9; }
  .bad { color: #f77; }
</style>
<h1>whatslab WebXR 손 송신</h1>
<button id="go">VR 시작</button>
<div id="log">대기 중</div>
<script>
const logEl = document.getElementById("log");
const goEl = document.getElementById("go");
const STALL_MS = 1000, BUFFER_MAX = 65536, RETRY_MS = 500;
let ws = null, session = null, refSpace = null, gl = null, glLayer = null;
let sent = 0, dropped = 0, reconnects = 0, lastReport = 0, stalledSince = 0, reconnectAt = 0;
let passthrough = false;

function log(text, bad) { logEl.textContent = text; logEl.className = bad ? "bad" : ""; }

function dropSocket() {
  if (!ws) return;
  ws.onclose = ws.onerror = ws.onopen = null;
  ws.close();
  ws = null;
  stalledSince = 0;
}

function connect() {
  dropSocket();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const sock = new WebSocket(proto + "//" + location.host + "/ws");
  sock.onopen = () => { stalledSince = 0; };
  sock.onclose = sock.onerror = () => { if (ws === sock) { ws = null; stalledSince = 0; } };
  ws = sock;
}

function socketReady(t) {
  if (!ws) {
    if (session && t > reconnectAt) { reconnectAt = t + RETRY_MS; reconnects++; connect(); }
    return false;
  }
  if (ws.readyState === WebSocket.CONNECTING) return false;
  if (ws.readyState !== WebSocket.OPEN) { dropSocket(); return false; }
  if (ws.bufferedAmount > BUFFER_MAX) {
    if (!stalledSince) stalledSince = t;
    else if (t - stalledSince > STALL_MS) { dropSocket(); reconnects++; }
    dropped++;
    return false;
  }
  stalledSince = 0;
  return true;
}

const R5 = (v) => Math.round(v * 1e5) / 1e5;
function readHand(frame, hand) {
  const out = [];
  for (const space of hand.values()) {
    const jp = frame.getJointPose(space, refSpace);
    if (!jp) return null;
    const p = jp.transform.position, o = jp.transform.orientation;
    out.push(R5(o.x), R5(o.y), R5(o.z), R5(o.w), R5(p.x), R5(p.y), R5(p.z), R5(jp.radius));
  }
  return out.length === 25 * 8 ? out : null;
}

function onFrame(t, frame) {
  session.requestAnimationFrame(onFrame);
  gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
  gl.clearColor(0, 0, 0, passthrough ? 0 : 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const hands = {};
  for (const src of session.inputSources) {
    if ((src.handedness !== "left" && src.handedness !== "right") || !src.hand) continue;
    const joints = readHand(frame, src.hand);
    if (joints) hands[src.handedness] = joints;
  }
  if (!Object.keys(hands).length || !socketReady(t)) return;
  ws.send(JSON.stringify({ t: t, hands: hands }));
  sent++;
  if (t - lastReport > 500) {
    lastReport = t;
    log(`전송 ${sent}  드롭 ${dropped}  재연결 ${reconnects}  손 ${Object.keys(hands).length}` +
        (passthrough ? "  [패스스루]" : "  [VR]"));
  }
}

async function requestSession() {
  const opts = { requiredFeatures: ["local-floor"], optionalFeatures: ["hand-tracking"] };
  if (await navigator.xr.isSessionSupported("immersive-ar")) {
    const s = await navigator.xr.requestSession("immersive-ar", opts).catch(() => null);
    if (s) {
      passthrough = true;
      return s;
    }
  }
  passthrough = false;
  return navigator.xr.requestSession("immersive-vr", opts);
}

async function start() {
  if (!navigator.xr) { log("navigator.xr 없음 — WebXR 미지원 브라우저다", true); return; }
  goEl.disabled = true;
  dropSocket();
  sent = dropped = reconnects = lastReport = reconnectAt = 0;
  const failure = (err) => { log("세션 시작 실패: " + err, true); return null; };
  session = await requestSession().catch(failure);
  if (!session) { goEl.disabled = false; return; }
  session.addEventListener("end", () => {
    session = null; goEl.disabled = false; dropSocket();
    log(`세션 종료 — 전송 ${sent} 드롭 ${dropped} 재연결 ${reconnects}`);
  });
  gl = document.createElement("canvas").getContext("webgl", { xrCompatible: true, alpha: true });
  if (!gl) { log("WebGL 컨텍스트를 못 만들었다", true); return; }
  glLayer = new XRWebGLLayer(session, gl, { alpha: true });
  await session.updateRenderState({ baseLayer: glLayer });
  refSpace = await session.requestReferenceSpace("local-floor");
  connect();
  log((passthrough ? "패스스루" : "VR") + " 세션 — 컨트롤러를 내려놓으면 손이 추적된다");
  session.requestAnimationFrame(onFrame);
}

goEl.addEventListener("click", start);
if (!window.isSecureContext) {
  log("보안 컨텍스트가 아니다 — WebXR 은 HTTPS 이거나 localhost 에서만 뜬다.\n" +
      "무선: https:// 주소로 접속해 인증서 경고를 수락하라.\n" +
      "유선: adb reverse tcp:PORT tcp:PORT 로 localhost 로 열어라.", true);
}
</script>
