[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatslab-teleop-onnx"
version = "0.2.0"
description = "WHATs LAB hand retargeting — ONNX inference path only (demo/teleop branch)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "WHATs LAB Corp" }]
# 공개 source-available — git clone 후 pip install 로 배포한다 (PyPI 미업로드).
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
# 이 브랜치는 배포 경로만 남긴다. 사람 FK 가 ONNX 그래프 안에 들어 있어
# 추론에 필요한 건 onnxruntime 과 numpy 뿐이다 — torch·pinocchio·nlopt·
# dex-retargeting 의존이 전부 없다.
dependencies = [
    # numpy<2 고정: 소비자 스택(dex-retargeting·Isaac Sim 5.1)이 numpy<2 를
    # 요구한다. 상한이 없으면 fresh 설치가 numpy2 를 끌어와 env 를 오염시킨다.
    "numpy>=1.24,<2",
    "onnxruntime",
]

[project.optional-dependencies]
# URDF 경로 조회(UniRetargeter.urdf_path)에만 쓴다. 리타게팅 자체는 필요 없다.
urdf = ["dexhand-description @ git+https://github.com/whats-lab/dexterous-hand-urdf.git"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whatslab.solvers.hand" = ["assets/*.onnx", "assets/*.npz"]
