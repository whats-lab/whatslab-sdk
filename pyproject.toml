[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatslab-sdk"
version = "0.5.0"
description = "WHATs LAB hand SDK — glove / hand-tracking input and robot-hand retargeting (ROS-independent)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "WHATs LAB Corp" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml",
]

[project.optional-dependencies]
receiver = ["airglove-client @ git+https://github.com/whats-lab/AirGlove-Client.git@v0.4.0#subdirectory=python"]
hand     = ["pin", "dex-retargeting>=0.4.6", "torch", "six",
            "dexhand-description @ git+https://github.com/whats-lab/dexterous-hand-urdf.git"]
viz      = ["viser", "trimesh", "pin"]
webxr    = ["websockets>=13"]
all      = ["whatslab-sdk[receiver,hand,viz,webxr]"]
dev      = ["pytest"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["whatslab*"]

[tool.setuptools.package-data]
whatslab = ["configs/**", "receiver/webxr/static/*.html", "retarget/geort/assets/*.npz"]

[tool.setuptools.exclude-package-data]
whatslab = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["whatslab"]
known-local-folder = ["conftest", "test_webxr_receiver"]
